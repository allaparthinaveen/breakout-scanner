# ==============================================================================
# INTRADAY 1H SWING CONFIG (1-2 DAYS OPTIMAL LONG MODEL)
# Empirically validated in Phase 2 across US Equities (+0.026R, 1.08 PF, 19.3% DD)
# and European Equities (1.05 PF, 12.8% DD).
# ==============================================================================
timeframe:
  interval: 1h
  period: 60d

trend:
  sma_length: 50
  use_trend_filter: true
  use_slope_filter: false             # Optional SMA slope filter
  slope_lookback_bars: 5

base:
  base_lookback: 20
  tight_lookback: 5
  max_base_range_pct: 12.0
  max_tight_range_pct: 6.0
  require_tightening: false
  min_setup_bars: 5
  max_setup_bars: 30
  tightening_threshold: 0.70

volume:
  use_volume_contraction: false
  volume_length: 20
  contraction_ratio: 0.90
  use_breakout_volume: true
  breakout_multiplier: 1.20
  vdu_threshold: 0.75
  rvol_threshold: 1.20
  use_hourly_volume_profile: true     # Key Edge: Benchmarks vs median of same hour
  hourly_profile_days: 20

breakout:
  allow_shorts: false                 # Long-Only: Eliminates equities short drag (-0.19R)
  buffer_pct: 0.10
  close_location: 0.55
  require_momentum_candle: true
  min_body_pct: 40.0
  use_open_confirmation: true         # Filters adverse gaps on next candle open
  max_open_gap_pct: 0.50

risk:
  atr_length: 14
  atr_multiplier: 1.50
  min_stop_pct: 0.75                  # Minimum stop distance noise floor
  max_stop_pct: 5.00
  use_structure_stop: true
  structure_buffer_pct: 0.25
  account_size: 100000.0
  risk_per_trade_pct: 1.0
  slippage_pct: 0.05
  commission_pct: 0.05
  use_cost_filter: true               # Critical: Rejects trades where fees eat > 15% of stop distance
  max_friction_r: 0.15

target:
  target_lookback: 50
  tp1_r: 1.0
  tp2_r: 2.0

management:
  use_breakeven: true
  breakeven_offset_pct: 0.10
  max_hold_bars: 14                   # Exactly ~2 full 7-hour trading sessions
  max_hold_days: 2.0
  use_time_exit: true
  use_failed_breakout_exit: false
  failed_breakout_max_bars: 3
