# ==============================================================================
# DAILY MULTI-DAY SWING CONFIG (TRADITIONAL MINERVINI VCP)
# Designed for classic multi-day position and swing trading on 1D daily candles.
# ==============================================================================
timeframe:
  interval: 1d
  period: 2y

trend:
  sma_length: 50
  use_trend_filter: true
  use_slope_filter: true
  slope_lookback_bars: 5

base:
  base_lookback: 20
  tight_lookback: 5
  max_base_range_pct: 12.0
  max_tight_range_pct: 6.0
  require_tightening: true            # Insists on progressive contraction (T1 -> T2 -> T3)
  min_setup_bars: 5
  max_setup_bars: 35
  tightening_threshold: 0.70
  min_box_density_pct: 75.0           # Consolidation Quality Gate: min 75% of closes inside base range

volume:
  use_volume_contraction: true
  volume_length: 20
  contraction_ratio: 0.85
  use_breakout_volume: true
  breakout_multiplier: 1.30
  vdu_threshold: 0.70
  rvol_threshold: 1.30
  use_hourly_volume_profile: false    # Not used on daily bars
  hourly_profile_days: 20

breakout:
  allow_shorts: false                 # Long swing trades
  buffer_pct: 0.10
  close_location: 0.60
  require_momentum_candle: true
  min_body_pct: 45.0
  use_open_confirmation: true
  max_open_gap_pct: 0.50

risk:
  atr_length: 14
  atr_multiplier: 1.50
  min_stop_pct: 1.50                  # Daily noise floor
  max_stop_pct: 7.00
  use_structure_stop: true
  structure_buffer_pct: 0.30
  account_size: 100000.0
  risk_per_trade_pct: 1.0
  slippage_pct: 0.05
  commission_pct: 0.05
  use_cost_filter: true
  max_friction_r: 0.10

target:
  target_lookback: 50
  tp1_r: 1.0
  tp2_r: 2.5

management:
  use_breakeven: true
  breakeven_offset_pct: 0.10
  max_hold_days: 10
  use_time_exit: true
  use_failed_breakout_exit: false
  failed_breakout_max_bars: 3
