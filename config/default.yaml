trend:
  sma_length: 50
  use_trend_filter: true
  use_slope_filter: false             # Flag: require upward/downward sloping SMA50
  slope_lookback_bars: 5              # Lookback bars for SMA50 slope comparison
base:
  base_lookback: 20
  tight_lookback: 5
  max_base_range_pct: 12.0
  max_tight_range_pct: 6.0
  require_tightening: false
  min_setup_bars: 5
  max_setup_bars: 30
  tightening_threshold: 0.70
volume:
  use_volume_contraction: false
  volume_length: 20
  contraction_ratio: 0.90
  use_breakout_volume: true
  breakout_multiplier: 1.20
  vdu_threshold: 0.75
  rvol_threshold: 1.20
  use_hourly_volume_profile: false    # Flag: compare against same-hour historical median (removes open/close bias)
  hourly_profile_days: 20             # Prior sessions lookback for same-hour volume benchmark
breakout:
  buffer_pct: 0.10
  close_location: 0.55
  require_momentum_candle: true
  min_body_pct: 40.0
  use_open_confirmation: false        # Flag: require next-bar open to hold above breakout level
  max_open_gap_pct: 0.50              # Maximum adverse gap percentage tolerated on open
risk:
  atr_length: 14
  atr_multiplier: 1.50
  min_stop_pct: 0.75                  # Noise floor: minimum stop distance to prevent spread churn
  max_stop_pct: 5.00                  # Risk gate: setups with structural risk > 5.00% are rejected (never clamped)
  use_structure_stop: true
  structure_buffer_pct: 0.25          # Buffer beyond base support/resistance
  account_size: 100000.0              # Base account capital
  risk_per_trade_pct: 1.0             # Dynamic position sizing: exact 1.0% capital risk per trade
  slippage_pct: 0.05
  commission_pct: 0.05
  use_cost_filter: false              # Flag: reject setups where friction eats too much of the risk
  max_friction_r: 0.15                # Maximum friction allowed (round-trip fees / stop distance in R, e.g. 0.15 = 15% of 1R)
target:
  target_lookback: 50
  tp1_r: 1.0
  tp2_r: 2.0
management:
  use_breakeven: true
  breakeven_offset_pct: 0.10
  max_hold_days: 10
  use_time_exit: true
  use_failed_breakout_exit: false     # Flag: quickly exit if price closes back inside base
  failed_breakout_max_bars: 3         # Maximum bars after entry to check for failed breakout
