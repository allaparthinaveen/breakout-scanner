# 🏛️ Institutional Production Profile: NSE India Equities (Nifty 50 / F&O Universe)
# Profile Name: nse_production
profile_name: "NSE India Equities Production (XNSE)"
market: "NSE"
currency: "INR"

trend:
  sma_length: 50
  use_trend_filter: true
  use_slope_filter: true
  slope_lookback_bars: 5

base:
  base_lookback: 20
  tight_lookback: 5
  max_base_range_pct: 10.0
  max_tight_range_pct: 5.0
  require_tightening: true
  min_setup_bars: 5
  max_setup_bars: 30
  tightening_threshold: 0.70
  min_box_density_pct: 75.0

volume:
  use_volume_contraction: true
  volume_length: 20
  contraction_ratio: 0.90
  use_breakout_volume: true
  breakout_multiplier: 1.25
  vdu_threshold: 0.75
  rvol_threshold: 1.20
  use_hourly_volume_profile: true
  hourly_profile_days: 20

breakout:
  buffer_pct: 0.10
  close_location: 0.55
  require_momentum_candle: true
  min_body_pct: 40.0
  use_open_confirmation: true
  max_open_gap_pct: 0.50

risk:
  atr_length: 14
  atr_multiplier: 1.50
  min_stop_pct: 0.75
  max_stop_pct: 4.50
  use_structure_stop: true
  structure_buffer_pct: 0.25
  account_size: 1000000.0  # INR 10,00,000 (10 Lakhs)
  risk_per_trade_pct: 1.0   # INR 10,000 per trade
  slippage_pct: 0.05
  commission_pct: 0.10      # Includes STT (0.1% on delivery or 0.025% on intraday), GST, SEBI turnover fees
  use_cost_filter: true
  max_friction_r: 0.15

target:
  target_lookback: 50
  tp1_r: 1.0
  tp2_r: 2.0

management:
  use_breakeven: true
  breakeven_offset_pct: 0.10
  max_hold_days: 10
  use_time_exit: true
  use_failed_breakout_exit: true
  failed_breakout_max_bars: 3

signal_quality:
  enabled: true
  require_clv_confirmation: true
  min_clv_threshold: 0.65
  max_failed_breakouts_in_base: 2
  close_location_weight: 15.0
  vdu_slope_weight: 10.0
  trigger_tightness_weight: 10.0
  failed_breakout_penalty_weight: 10.0

confluence_context:
  enabled: true
  htf_4h_weight: 10.0
  market_regime_weight: 5.0
  earnings_risk_weight: 5.0

portfolio_guard:
  enabled: true
  account_equity: 1000000.0
  risk_per_trade_pct: 1.0
  max_daily_risk_pct: 2.0
  max_active_trades: 4
  max_sector_allocation_pct: 25.0
  max_position_size_pct: 20.0
  max_trades_per_sector: 1
  allow_fractional: false

rejection_gate:
  enabled: true
  max_stop_pct: 4.5
  max_friction_r: 0.15
  min_rr_ratio: 1.0
  earnings_buffer_days: 3
  enforce_earnings_check: true
  enforce_anti_chase: true
  max_extension_pct: 1.0
  max_failed_breakouts_in_base: 2

confirmation_policy:
  enabled: true
  min_auto_entry_score: 85

friction:
  base_slippage_pct: 0.05
  commission_pct: 0.10      # Indian statutory friction breakdown (STT + GST + Stamp Duty)
  use_dynamic_slippage: true
  max_friction_r: 0.15

safeguards:
  enforce_stale_data: true
  max_stale_data_seconds: 120
  kill_switch_file: "data/KILL_SWITCH"
  max_daily_loss_pct: 2.0
  max_spread_pct: 0.5
  min_liquidity_volume: 25000

dynamic_universe:
  enabled: true
  target_size: 30
  buffer_cutoff: 35
  min_active_sessions: 18
  lookback_days: 20
  min_price:
    nse: 50.0
  max_sector_concentration: 8
  max_spread_pct: 5.0
  max_avg_gap_pct: 2.5
  metadata_dir: "data/universe"
