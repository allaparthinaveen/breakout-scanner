version: "3.8"

services:
  breakout-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breakout_cloud_daemon
    restart: unless-stopped
    environment:
      - AWS_DEFAULT_REGION=ap-southeast-1
      - KILL_SWITCH=FALSE
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python3", "production_daemon.py", "--status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
